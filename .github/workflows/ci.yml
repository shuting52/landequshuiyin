name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.gradle(依赖 + wrapper 发行包,后者一个就有 200MB)。
          # 依赖文件按 **/gradle-wrapper.properties 认,这个文件是进库的。
          # 首跑仍然要下全套,之后那步 apk 构建能从几分钟掉到几十秒。
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # lib/secrets.dart is gitignored, and the app does not compile without it.
      # The template is enough here: the tests stub the network, and no real key is needed.
      - run: cp lib/secrets.example.dart lib/secrets.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # gradlew / gradle-wrapper.jar / local.properties 都不进版本库(Flutter 模板的
      # android/.gitignore 忽略了它们),干净检出里一个都没有 —— 直接跑 ./gradlew 会
      # 报 "No such file or directory"。先让它跑一次 Android 构建,把这些补齐,
      # 顺带把 Kotlin 编译这道门也过了。
      # release 版:没有 key.properties 时自动退回 debug 签名,可直接安装体验。
      - run: flutter build apk --release

      # Native side: pure-function tests over DownloadNames / LaunchActivities / NativeDownloader.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android

      # 上传 APK 产物,方便直接下载安装体验。
      - uses: actions/upload-artifact@v4
        with:
          name: jicun-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
