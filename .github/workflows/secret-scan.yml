name: Secret Scan

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 扫描工作区与全历史中的密钥
        run: |
          set -uo pipefail
          FAIL=0
          echo "▶ 1/3 检查工作区是否存在真实密钥文件"
          if [ -f "lib/secrets.dart" ]; then
            echo "::error::lib/secrets.dart 不应被提交(只允许 secrets.example.dart)?"
            FAIL=1
          fi
          echo "▶ 2/3 检查历史中是否出现过 lib/secrets.dart"
          if git log --all --oneline -- lib/secrets.dart | grep -q .; then
            echo "::error::lib/secrets.dart 出现在 git 历史中,请用 git filter-repo 抹掉"
            FAIL=1
          fi
          echo "▶ 3/3 全历史 grep 常见密钥模式"
          if git rev-list --all | while read c; do
            git grep -I -n -E \
              '(ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|sessionid_ss=[A-Za-z0-9]{10,}|passport_csrf_token=[A-Za-z0-9]{10,}|X-API-Key[^,;\n]{0,40}[A-Za-z0-9]{20,})' \
              "$c" -- . ':!*.md' ':!*.lock' 2>/dev/null; done | grep -v '^$' | head -20 | grep -q .; then
            echo "::error::在 git 历史中发现疑似密钥(见上方输出)"
            FAIL=1
          fi
          echo "▶ 结果 FAIL=$FAIL"
          exit $FAIL